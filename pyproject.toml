[project]
name = "cc-otel"
version = "0.1.0"
description = "Claude Code developer-usage telemetry: ingest → store → report"
requires-python = ">=3.13"
# Depend on every workspace member so a plain `uv sync` installs them (and their
# runtime deps) into the environment — the virtual root isn't built itself.
dependencies = ["cc-otel-sink"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["sink"]

[tool.uv.sources]
cc-otel-sink = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.15",
    "mypy>=1.14",
    "sqlfluff>=4.2",
    "pytest>=8",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "testcontainers>=4.14",
    "pre-commit>=4",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "duckdb>=1.1",
    "pyyaml>=6",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Strict static typing on the sink ingest path only (#113): a type error here is
# silent and permanent — bad telemetry lands in `raw` and propagates through
# staging → marts. `tools/`, `installer/`, tests stay unchecked (loose analog of
# the crm graded-strictness pattern this borrows from).
[tool.mypy]
files = ["sink/src"]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Repo root on sys.path so tests import the uninstalled `tools` package (the sink is
# found via its installed workspace member; `tools/` is source-only).
pythonpath = ["."]
testpaths = ["sink/tests", "tools/tests", "tests/integration"]
markers = [
    "integration: end-to-end test requiring Docker (testcontainers Postgres or docker compose); run with `-m integration`",
]

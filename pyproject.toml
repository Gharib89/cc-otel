[project]
name = "cc-otel"
version = "0.1.0"
description = "Claude Code developer-usage telemetry: ingest → store → report"
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["sink"]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "sqlfluff>=4.2",
    "pytest>=8",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "testcontainers>=4.14",
    "pre-commit>=4",
    "psycopg[binary]>=3.2",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["sink/tests", "tests/integration"]

# Smoke-test stand-in for the FastAPI sink (NOT shipped). A second contrib
# collector that accepts OTLP/JSON on :8080 and prints every record via the
# debug exporter, so the smoke test can assert delivery by scanning its logs.
# Runs in the primary collector's network namespace, so this :8080 is exactly
# the 127.0.0.1:8080 the primary's exporter targets.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:8080

exporters:
  debug:
    verbosity: detailed

service:
  telemetry:
    # Disable this collector's own metrics endpoint — it shares the primary
    # collector's network namespace, and both otherwise fight over :8888.
    metrics:
      level: none
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]

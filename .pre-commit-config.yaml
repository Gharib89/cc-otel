# Fast hooks only (<~5s). Heavy checks (pytest, sqlfluff over the whole tree,
# type-checking) run in CI, not here.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.2.2
    hooks:
      - id: sqlfluff-lint
        # Authored SQL only. schema.sql is a generated dbmate dump, and
        # db/views/marts/ are generated pg_matviews.definition dumps (#263) —
        # never lint either.
        files: ^db/.*\.sql$
        exclude: ^db/(schema\.sql|views/marts/.*\.sql)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # powerbi/ line endings are owned by .gitattributes + Desktop (#234):
      # keep these mutating fixers off that tree so `-a` never fights Desktop.
      - id: trailing-whitespace
        exclude: ^powerbi/
      - id: end-of-file-fixer
        exclude: ^powerbi/
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

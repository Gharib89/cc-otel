# Fast hooks only (<~5s). Heavy checks (pytest, sqlfluff over the whole tree,
# type-checking) run in CI, not here.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.2.2
    hooks:
      - id: sqlfluff-lint
        # Authored SQL only. schema.sql is a generated dbmate dump — never lint it.
        files: ^db/.*\.sql$
        exclude: ^db/schema\.sql$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

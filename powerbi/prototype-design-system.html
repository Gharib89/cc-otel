<!DOCTYPE html>
<!--
  PROTOTYPE - THROWAWAY - issue #110 (map #104)
  Three variants of the cc-otel report design system, mocked as the Executive
  Overview page on a 1280x720 Power BI canvas. Switch via ?variant=A|B|C,
  the floating bottom bar, or arrow keys. Not production code.
  Palette: powerbi/branding/design-tokens.json (categoricalLight, validated).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-otel design-system prototype — #110</title>
<style>
  :root{
    --ink:#0E2841; --ink2:#44566B; --ink3:#7E8CA0;
    --surface:#FCFCFB; --canvas:#F1F2F4;
    --c-blue:#3A44D4; --c-cyan:#0198CB; --c-green:#6E9A21;
    --c-purple:#792A8E; --c-gold:#A17E00; --c-red:#B61E24;
    --brand-dark:#0E2841; --wordmark:#00197F;
    --grad-teal:#00D9C6; --grad-blue:#44ADFD; --grad-purple:#B863FC;
    --font:'Century Gothic',CenturyGothic,'Questrial','Trebuchet MS',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#3d434c;font-family:var(--font);color:var(--ink);
       display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px 0 90px}
  .stage-wrap{width:min(96vw,1280px)}
  .stage{width:1280px;height:720px;transform-origin:top left;background:var(--surface);
         box-shadow:0 8px 40px rgba(0,0,0,.45);overflow:hidden;position:relative}
  .variant-title{color:#cfd6df;font-size:14px;margin:0 0 10px 2px;letter-spacing:.4px}
  .variant-title b{color:#fff}

  /* ============ shared chart bits ============ */
  svg text{font-family:var(--font)}
  .axis{fill:var(--ink3);font-size:11px}
  .grid{stroke:#E6E8EA;stroke-width:1}
  .lbl{fill:var(--ink);font-size:12px;font-weight:700}
  .lbl2{fill:var(--ink2);font-size:11px}

  /* ============ VARIANT A — Tiled ============ */
  .vA{background:var(--canvas)}
  .vA header{display:flex;align-items:center;gap:24px;padding:16px 28px 12px}
  .vA .logo{font-weight:700;font-size:18px;color:var(--wordmark)}
  .vA .logo span{background:linear-gradient(90deg,var(--grad-teal),var(--grad-blue),var(--grad-purple));
                 -webkit-background-clip:text;background-clip:text;color:transparent}
  .vA h1{font-size:17px;font-weight:700;flex:0 0 auto}
  .vA .fresh{margin-left:auto;background:#fff;border:1px solid #E0E3E7;border-radius:999px;
             padding:5px 14px;font-size:11.5px;color:var(--ink2);display:flex;gap:7px;align-items:center}
  .vA .fresh i{width:8px;height:8px;border-radius:50%;background:var(--c-green)}
  .vA nav{display:flex;gap:8px;padding:0 28px 14px}
  .vA nav a{font-size:12.5px;padding:7px 16px;border-radius:999px;color:var(--ink2);
            text-decoration:none;background:transparent}
  .vA nav a.on{background:var(--c-blue);color:#fff;font-weight:700}
  .vA nav a:not(.on):hover{background:#E7E9EC}
  .vA .grid12{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0 28px}
  .vA .card{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(14,40,65,.08),0 4px 14px rgba(14,40,65,.05);
            padding:16px 18px}
  .vA .kpi .k-label{font-size:11.5px;color:var(--ink2);margin-bottom:6px}
  .vA .kpi .k-value{font-size:30px;font-weight:700;line-height:1.05}
  .vA .kpi .k-delta{font-size:11.5px;margin-top:5px}
  .vA .kpi .up{color:var(--c-green)} .vA .kpi .down{color:var(--c-red)}
  .vA .hero-card{grid-column:span 1;background:#fff}
  .vA .charts{display:grid;grid-template-columns:2fr 1fr;gap:14px;padding:14px 28px 0}
  .vA .card h3{font-size:13px;font-weight:700;margin-bottom:2px}
  .vA .card .sub{font-size:11px;color:var(--ink3);margin-bottom:8px}

  /* ============ VARIANT B — Command band ============ */
  .vB{background:var(--surface)}
  .vB .band{background:var(--brand-dark);color:#fff;padding:18px 32px 0}
  .vB .band-top{display:flex;align-items:center;gap:20px}
  .vB .logo{font-weight:700;font-size:17px;color:#fff}
  .vB .logo span{background:linear-gradient(90deg,var(--grad-teal),var(--grad-blue),var(--grad-purple));
                 -webkit-background-clip:text;background-clip:text;color:transparent}
  .vB .band h1{font-size:15px;font-weight:400;color:#B9C6D4;letter-spacing:.3px}
  .vB .fresh{margin-left:auto;font-size:11.5px;color:#B9C6D4;display:flex;gap:7px;align-items:center}
  .vB .fresh i{width:8px;height:8px;border-radius:50%;background:#97C93B}
  .vB .hero-row{display:flex;align-items:flex-end;gap:56px;padding:20px 0 22px}
  .vB .hero-num{font-size:64px;font-weight:700;line-height:.95;color:#fff}
  .vB .hero-cap{font-size:12.5px;color:#B9C6D4;margin-top:8px}
  .vB .band-kpi{display:flex;gap:48px;padding-bottom:4px}
  .vB .band-kpi .k-label{font-size:11px;color:#8FA1B3;margin-bottom:4px}
  .vB .band-kpi .k-value{font-size:24px;font-weight:700;color:#fff}
  .vB .band-kpi .k-delta{font-size:11px;color:#B9C6D4;margin-top:3px}
  .vB nav{display:flex;gap:28px;border-top:1px solid rgba(255,255,255,.14);margin-top:4px}
  .vB nav a{font-size:12.5px;color:#9FB0C0;text-decoration:none;padding:12px 2px;border-bottom:3px solid transparent}
  .vB nav a.on{color:#fff;font-weight:700;border-bottom-color:var(--grad-blue)}
  .vB .body{padding:20px 32px;display:grid;grid-template-columns:1.7fr 1fr;gap:0}
  .vB .sec{padding:0 24px 0 0}
  .vB .sec+.sec{border-left:1px solid #E6E8EA;padding:0 0 0 24px}
  .vB h3{font-size:13px;font-weight:700;margin-bottom:2px}
  .vB .sub{font-size:11px;color:var(--ink3);margin-bottom:10px}
  .vB .subsec{margin-top:18px;padding-top:14px;border-top:1px solid #E6E8EA}

  /* ============ VARIANT C — Editorial ============ */
  .vC{background:var(--surface)}
  .vC header{display:flex;align-items:baseline;gap:36px;padding:22px 44px 14px}
  .vC .logo{font-weight:700;font-size:16px;color:var(--wordmark)}
  .vC .logo span{background:linear-gradient(90deg,var(--grad-teal),var(--grad-blue),var(--grad-purple));
                 -webkit-background-clip:text;background-clip:text;color:transparent}
  .vC nav{display:flex;gap:24px;margin-left:8px}
  .vC nav a{font-size:12px;color:var(--ink3);text-decoration:none;padding-bottom:5px;border-bottom:2px solid transparent}
  .vC nav a.on{color:var(--ink);font-weight:700;border-bottom-color:var(--c-cyan)}
  .vC .fresh{margin-left:auto;font-size:11px;color:var(--ink3);display:flex;gap:6px;align-items:center}
  .vC .fresh i{width:7px;height:7px;border-radius:50%;background:var(--c-green)}
  .vC .rule{height:2px;margin:0 44px;background:linear-gradient(90deg,var(--grad-teal),var(--grad-blue),var(--grad-purple))}
  .vC .body{display:grid;grid-template-columns:400px 1fr;gap:56px;padding:34px 44px 0}
  .vC .hero-num{font-size:104px;font-weight:700;line-height:.9;letter-spacing:-2px}
  .vC .hero-cap{font-size:14px;color:var(--ink2);margin:14px 0 4px;line-height:1.5;max-width:340px}
  .vC .statlist{margin-top:26px;border-top:1px solid #E6E8EA}
  .vC .statrow{display:flex;justify-content:space-between;align-items:baseline;
               padding:11px 0;border-bottom:1px solid #E6E8EA;font-size:12.5px;color:var(--ink2)}
  .vC .statrow b{font-size:17px;color:var(--ink);font-weight:700}
  .vC .statrow .d{font-size:11px;color:var(--c-green);margin-left:8px}
  .vC h3{font-size:13px;font-weight:700}
  .vC .sub{font-size:11px;color:var(--ink3);margin:1px 0 10px}
  .vC .rightsec+.rightsec{margin-top:24px}

  /* ============ floating switcher ============ */
  .switcher{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:99;
            background:#111827;color:#fff;border-radius:999px;display:flex;align-items:center;
            gap:4px;padding:6px 8px;box-shadow:0 6px 24px rgba(0,0,0,.5);font-family:var(--font)}
  .switcher button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;
                   width:36px;height:36px;border-radius:50%}
  .switcher button:hover{background:rgba(255,255,255,.15)}
  .switcher .cur{font-size:13px;padding:0 10px;min-width:210px;text-align:center}
  .switcher .cur b{color:#7dd3fc}
</style>
</head>
<body>
<p class="variant-title" id="vt"></p>
<div class="stage-wrap"><div class="stage" id="stage"></div></div>

<div class="switcher">
  <button id="prev" title="previous (←)">←</button>
  <div class="cur" id="cur"></div>
  <button id="next" title="next (→)">→</button>
</div>

<script>
/* ---------- mock data (28-day frame, ~40 seats) ---------- */
const D = {
  utilPct: 78, active: 31, seats: 40,
  wau: [14,16,15,18,19,21,20,22,24,23,25,26],
  wauLabels: ["W16","","W18","","W20","","W22","","W24","","W26",""],
  tiers: [ {name:"Standard", active:22, seats:28, color:"var(--c-blue)", track:"#D9DBF6"},
           {name:"Premium",  active:9,  seats:12, color:"var(--c-cyan)", track:"#CDEAF4"} ],
  accept: [81,83,82,85,86,87],
  kpis: [
    {label:"Weekly active users", value:"26", delta:"+3 vs prior week", up:true},
    {label:"Prompts per active user / day", value:"42", delta:"+6 vs prior 28d", up:true},
    {label:"Tool acceptance rate", value:"87%", delta:"+2 pts vs prior 28d", up:true},
    {label:"Commits with Claude (28d)", value:"214", delta:"−11 vs prior 28d", up:false},
  ],
  pages: ["Executive Overview","Adoption & Engagement","Impact","Usage & Capacity","Ecosystem","Data Health"],
};

/* ---------- tiny SVG builders (obey mark specs) ---------- */
function lineChart({w,h,data,labels,color="#3A44D4",pad={t:14,r:46,b:22,l:30}}){
  const min=Math.min(...data)-2, max=Math.max(...data)+2;
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const x=i=>pad.l+i*(iw/(data.length-1));
  const y=v=>pad.t+ih-( (v-min)/(max-min) )*ih;
  const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  const area=`M ${x(0)},${y(data[0])} `+data.map((v,i)=>`L ${x(i)},${y(v)}`).join(" ")+
             ` L ${x(data.length-1)},${pad.t+ih} L ${x(0)},${pad.t+ih} Z`;
  const gridVals=[Math.round(min+ (max-min)*0.25), Math.round(min+(max-min)*0.75)];
  let g="";
  gridVals.forEach(v=>{ g+=`<line class="grid" x1="${pad.l}" x2="${w-pad.r}" y1="${y(v)}" y2="${y(v)}"/>
      <text class="axis" x="${pad.l-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;});
  let xl="";
  labels.forEach((s,i)=>{ if(s) xl+=`<text class="axis" x="${x(i)}" y="${h-6}" text-anchor="middle">${s}</text>`;});
  const lx=x(data.length-1), ly=y(data[data.length-1]);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    ${g}
    <path d="${area}" fill="${color}" opacity="0.10"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx}" cy="${ly}" r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
    <text class="lbl" x="${lx+9}" y="${ly+4}">${data[data.length-1]}</text>
    ${xl}
  </svg>`;
}

/* seat meters: fill = active, lighter track = seats (meter spec) */
function tierMeters({w,rowH=52,tiers}){
  const h=tiers.length*rowH+6, bw=w-120;
  let out="";
  tiers.forEach((t,i)=>{
    const y0=i*rowH+8;
    const fw=Math.round(bw*t.active/t.seats);
    out+=`
    <text class="lbl2" x="0" y="${y0+8}">${t.name}</text>
    <rect x="0" y="${y0+15}" width="${bw}" height="18" rx="4" fill="${t.track}"/>
    <rect x="0" y="${y0+15}" width="${fw}" height="18" rx="4" fill="${t.color}"/>
    <text class="lbl" x="${bw+10}" y="${y0+29}">${t.active} / ${t.seats}</text>`;
  });
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${out}</svg>`;
}

function sparkline({w=120,h=34,data,color="#3A44D4"}){
  const min=Math.min(...data)-1,max=Math.max(...data)+1;
  const x=i=>4+i*((w-24)/(data.length-1));
  const y=v=>4+(h-8)-((v-min)/(max-min))*(h-8);
  const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${x(data.length-1)}" cy="${y(data[data.length-1])}" r="3.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
  </svg>`;
}

function navHtml(cls){ return D.pages.map((p,i)=>`<a href="#" class="${i===0?'on':''}">${p}</a>`).join(""); }

/* ---------- Variant A — Tiled ---------- */
function VariantA(){
  return `<div class="vA" style="width:1280px;height:720px">
    <header>
      <div class="logo"><span>Ai</span>Worx</div>
      <h1>Claude Code Adoption — Executive Overview</h1>
      <div class="fresh"><i></i>Data fresh · refreshed 2h ago</div>
    </header>
    <nav>${navHtml()}</nav>
    <div class="grid12">
      <div class="card kpi hero-card">
        <div class="k-label">Seat utilization (28-day)</div>
        <div class="k-value" style="font-size:44px">${D.utilPct}%</div>
        <div class="k-delta">${D.active} of ${D.seats} paid seats active</div>
        <div style="margin-top:10px">${sparkline({data:D.wau,color:"var(--c-blue)",w:150})}</div>
      </div>
      ${D.kpis.slice(0,3).map(k=>`
      <div class="card kpi">
        <div class="k-label">${k.label}</div>
        <div class="k-value">${k.value}</div>
        <div class="k-delta ${k.up?'up':'down'}">${k.delta}</div>
      </div>`).join("")}
    </div>
    <div class="charts">
      <div class="card">
        <h3>Weekly active users</h3><div class="sub">12 weeks, all seats</div>
        ${lineChart({w:760,h:300,data:D.wau,labels:D.wauLabels,color:"var(--c-blue)"})}
      </div>
      <div class="card">
        <h3>Active users by seat tier</h3><div class="sub">28-day, vs seats held</div>
        ${tierMeters({w:360,tiers:D.tiers})}
        <h3 style="margin-top:22px">Tool acceptance</h3><div class="sub">6 weeks</div>
        ${lineChart({w:360,h:120,data:D.accept,labels:["","","","","",""],color:"var(--c-cyan)",pad:{t:10,r:44,b:8,l:34}})}
      </div>
    </div>
  </div>`;
}

/* ---------- Variant B — Command band ---------- */
function VariantB(){
  return `<div class="vB" style="width:1280px;height:720px">
    <div class="band">
      <div class="band-top">
        <div class="logo"><span>Ai</span>Worx</div>
        <h1>Claude Code Adoption</h1>
        <div class="fresh"><i></i>Data fresh · 2h ago</div>
      </div>
      <div class="hero-row">
        <div>
          <div class="hero-num">${D.utilPct}%</div>
          <div class="hero-cap">Seat utilization — ${D.active} of ${D.seats} paid seats active in the last 28 days</div>
        </div>
        <div class="band-kpi">
          ${D.kpis.map(k=>`
          <div><div class="k-label">${k.label}</div>
               <div class="k-value">${k.value}</div>
               <div class="k-delta">${k.delta}</div></div>`).join("")}
        </div>
      </div>
      <nav>${navHtml()}</nav>
    </div>
    <div class="body">
      <div class="sec">
        <h3>Weekly active users</h3><div class="sub">12 weeks, all seats</div>
        ${lineChart({w:700,h:280,data:D.wau,labels:D.wauLabels,color:"var(--c-blue)"})}
      </div>
      <div class="sec">
        <h3>Active users by seat tier</h3><div class="sub">28-day, vs seats held</div>
        ${tierMeters({w:400,tiers:D.tiers})}
        <div class="subsec">
          <h3>Tool acceptance</h3><div class="sub">6 weeks</div>
          ${lineChart({w:400,h:110,data:D.accept,labels:["","","","","",""],color:"var(--c-cyan)",pad:{t:10,r:44,b:8,l:34}})}
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- Variant C — Editorial ---------- */
function VariantC(){
  return `<div class="vC" style="width:1280px;height:720px">
    <header>
      <div class="logo"><span>Ai</span>Worx</div>
      <nav>${navHtml()}</nav>
      <div class="fresh"><i></i>Data fresh · 2h ago</div>
    </header>
    <div class="rule"></div>
    <div class="body">
      <div>
        <div class="hero-num">${D.utilPct}%</div>
        <div class="hero-cap"><b>${D.active} of ${D.seats}</b> paid seats were active in the last 28 days.
          Weekly actives are up 3 on the prior week.</div>
        <div class="statlist">
          ${D.kpis.map(k=>`
          <div class="statrow"><span>${k.label}</span>
            <span><b>${k.value}</b><span class="d" ${k.up?'':'style="color:var(--c-red)"'}>${k.delta.split(" vs")[0]}</span></span>
          </div>`).join("")}
        </div>
      </div>
      <div>
        <div class="rightsec">
          <h3>Weekly active users</h3><div class="sub">12 weeks, all seats</div>
          ${lineChart({w:700,h:270,data:D.wau,labels:D.wauLabels,color:"var(--c-blue)"})}
        </div>
        <div class="rightsec">
          <h3>Active users by seat tier</h3><div class="sub">28-day, vs seats held</div>
          ${tierMeters({w:560,tiers:D.tiers})}
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- switcher ---------- */
const VARIANTS = {
  A:{name:"Tiled — cards on gray canvas, pill nav",render:VariantA},
  B:{name:"Command band — dark hero header, flat body",render:VariantB},
  C:{name:"Editorial — whitespace, giant figure, text nav",render:VariantC},
};
const keys=Object.keys(VARIANTS);
function current(){ const v=new URLSearchParams(location.search).get("variant");
  return keys.includes(v)?v:"A"; }
function show(k){
  const u=new URL(location); u.searchParams.set("variant",k); history.replaceState(null,"",u);
  document.getElementById("stage").innerHTML=VARIANTS[k].render();
  document.getElementById("cur").innerHTML=`<b>${k}</b> — ${VARIANTS[k].name}`;
  document.getElementById("vt").innerHTML=`Variant <b>${k}</b>: ${VARIANTS[k].name} &nbsp;·&nbsp; 1280×720 PBI canvas`;
  fit();
}
function step(d){ const i=keys.indexOf(current()); show(keys[(i+d+keys.length)%keys.length]); }
document.getElementById("prev").onclick=()=>step(-1);
document.getElementById("next").onclick=()=>step(1);
document.addEventListener("keydown",e=>{
  if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName))return;
  if(e.key==="ArrowLeft")step(-1); if(e.key==="ArrowRight")step(1);
});
function fit(){
  const wrap=document.querySelector(".stage-wrap"), stage=document.getElementById("stage");
  const s=Math.min(1,wrap.clientWidth/1280);
  stage.style.transform=`scale(${s})`; wrap.style.height=(720*s)+"px";
}
window.addEventListener("resize",fit);
show(current());
</script>
</body>
</html>

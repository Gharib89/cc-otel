name: python

# Path-filtered per concern (CLAUDE.md): Python + SQL sources and their dep lock.
# The full pre-commit config (lint + format) plus mypy and the fast unit tests
# only — the Docker-backed integration suite lives in integration.yml, gated on
# its own paths (#37).
on:
  push:
    branches: [main]
    paths: &paths
      - "**/*.py"
      - "db/**/*.sql"
      - ".sqlfluff"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python.yml"
  pull_request:
    paths: *paths

# Private repo, metered minutes (#32): a review-loop push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One ubuntu runner (1x multiplier): a plain `uv sync` installs the sink
  # workspace member, then lint + unit tests in sequence. `-m "not integration"`
  # deselects the testcontainers suite so this job needs no Docker.
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Lint gate is the full pre-commit config (#234): .pre-commit-config.yaml is
      # the single source of truth for lint/format standards, so ruff-check,
      # ruff-format, and sqlfluff drift all fail CI here. Cache the hook envs so
      # they don't rebuild cold every run (metered minutes, #32).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      # Strict static typing, sink ingest path only (#113): a type error here is
      # silent and permanent — bad telemetry lands in `raw`. Scope is set in the
      # `[tool.mypy]` config (files = sink/src).
      - run: uv run mypy
      - run: uv run pytest -m "not integration"

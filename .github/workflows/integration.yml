name: integration

# Path-filtered per concern (CLAUDE.md): only the ingest/store/test surfaces and
# their dependency lock can affect these checks. Private repo — every run is
# metered, so keep the trigger tight.
on:
  push:
    branches: [main]
    paths: &paths
      - "sink/**"
      - "db/**"
      - "collector/**"
      - "tools/**"
      - "tests/integration/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/integration.yml"
  pull_request:
    paths: *paths

# Private repo, metered minutes (#32): a review-loop push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # End-to-end suite: testcontainers spins a throwaway Postgres (Docker is present
  # on GitHub-hosted ubuntu runners), applies every migration, and exercises the
  # OTLP → sink → raw → staging → marts pipeline.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m integration

  # Schema-drift gate: regenerating db/schema.sql from the migrations must not
  # change it. The verdict — regenerate, normalize the `-- Dumped ...` version
  # comments, diff — is owned by scripts/dev-migrate.sh --check (#225), which
  # self-spins its throwaway postgres:16 container; local-gate.sh runs the
  # identical call.
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Install pg_dump 17 (matches the committed schema.sql generator)
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Install dbmate
        # Pinned: dbmate controls schema.sql layout (incl. the `\restrict dbmate`
        # marker), so a floating version could drift the dump with no code change.
        run: |
          sudo curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/download/v2.34.1/dbmate-linux-amd64
          sudo chmod +x /usr/local/bin/dbmate

      - name: Fail on schema drift
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          scripts/dev-migrate.sh --check

      # spec_sync self-spins its own throwaway container (--database-url is
      # optional) — dev-migrate tears its DB down on exit, same as under
      # local-gate.
      - name: Verify column_spec converges with the migrations (#167)
        run: uv run python -m tools.spec_sync --check

      # Every mart body lives once as a canonical db/views/marts/ file; this proves
      # the files converge with pg_matviews.definition on a from-zero DB (#263).
      - name: Verify canonical mart files converge with the marts (#263)
        run: uv run python -m tools.matview_sync --check

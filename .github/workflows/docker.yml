name: docker

# Path-filtered per concern (CLAUDE.md): smoke-build the sink and collector
# images so a broken Dockerfile can't merge. PR-only by design — a no-push build
# on the merged main commit would burn metered minutes (#32) for an image nothing
# consumes; the real build-and-push lives in the deploy pipeline (#25).
on:
  pull_request:
    paths:
      - "sink/**"
      - "collector/**"
      - ".github/workflows/docker.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docker is preinstalled on GitHub-hosted ubuntu runners; plain `docker build`
  # needs no extra actions. The build context matches each Dockerfile's COPY paths
  # (sink/ is self-contained; collector/ bakes config.yaml into the contrib image).
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [sink, collector]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cc-otel-${{ matrix.image }}:ci ${{ matrix.image }}/

name: installer

# Path-filtered per concern (CLAUDE.md): only the fleet installer sources and this
# workflow trigger these checks. The installer is pushed to fleet machines by IS
# (issue #26), never deployed from CI; this workflow only lints and tests the
# sources. Bootstrap (operator/env setup) is a distinct concern with its own
# workflow (bootstrap.yml, #52) — PowerShell lint intentionally lives in more than
# one concern-workflow, the same way iac.yml runs PSRule independently.
on:
  push:
    branches: [main]
    paths: &paths
      - "installer/**"
      - ".github/workflows/installer.yml"
  pull_request:
    paths: *paths

# Private repo, metered minutes (#32): a review-loop push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PSScriptAnalyzer (must be clean) + the wrapper contract test. Both are
  # OS-agnostic — PSSA parses statically and `node --test` needs only the
  # preinstalled Node — so they run on ubuntu (1x minutes, #32).
  lint-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned analyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: PSScriptAnalyzer (fails on any finding)
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path ./installer -Recurse
          if ($findings) {
            $findings | Format-Table -AutoSize
            throw "PSScriptAnalyzer found $($findings.Count) issue(s)."
          }

      - name: Wrapper contract (node --test)
        run: node --test installer/test_wrapper.mjs

  # Pester dot-sources install.ps1, whose $InstallRoot default
  # (Join-Path $env:ProgramFiles ...) binds to null off Windows and fails to load,
  # so the suite needs a Windows runner. This is the pwsh leg (developer default);
  # the pester-winps51 job below runs the same suite under Windows PowerShell 5.1.
  # Two jobs rather than a `shell` matrix: the matrix context is not available in a
  # step's `shell:` key, so `shell: ${{ matrix.shell }}` is an invalid workflow.
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force

      - name: Pester
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = './installer'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  # The Windows PowerShell 5.1 leg of the Pester suite (see the pester job above).
  # 5.1 is the SYSTEM-context fleet runtime — IS pushes install.ps1 in SYSTEM
  # context on stock Windows — so this leg guards install.ps1's #Requires -Version
  # 5.1 contract against a 5.1-vs-7 divergence (the class of bug #91, now fixed).
  pester-winps51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Pester
        shell: powershell
        run: |
          # Windows PowerShell 5.1 defaults to TLS 1.0 for PSGallery; force 1.2
          # so Install-Module can resolve the source.
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force

      - name: Pester
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = './installer'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
